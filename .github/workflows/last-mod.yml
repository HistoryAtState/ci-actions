name: calculate last-modified data

on:
  workflow_call:
    inputs:
      include:
        description: >-
          Whitespace-separated bash glob patterns (matched against the
          repo-relative path; `*` also matches `/`). Only matching files get a
          .last-modified entry. hsg-shell only looks up `<id>.xml`.
        type: string
        default: '*.xml'
      exclude:
        description: >-
          Whitespace-separated bash glob patterns of files to skip even if they
          match `include`. Defaults to the build/packaging XML at the repo root.
        type: string
        default: 'build.xml build.properties.xml expath-pkg.xml repo.xml'

jobs:
    generate-lastmod:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                fetch-depth: 0
            - name: Create xml files in .last-modified folder
              env:
                INCLUDE: ${{ inputs.include }}
                EXCLUDE: ${{ inputs.exclude }}
                DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                    # Patterns must not be expanded against the working tree.
                    set -f

                    matches_any() {
                        local path=$1 pattern
                        shift
                        for pattern in "$@"; do
                            # shellcheck disable=SC2254 # pattern is meant to glob
                            case "$path" in $pattern) return 0 ;; esac
                        done
                        return 1
                    }

                    # Is a last-modified entry wanted for this repo-relative path?
                    is_tracked() {
                        # Skip dotfiles and files in hidden folders (starting with .)
                        [[ "$1" =~ ^\. ]] && return 1
                        # shellcheck disable=SC2086 # split patterns into words
                        matches_any "$1" $INCLUDE || return 1
                        # shellcheck disable=SC2086
                        matches_any "$1" $EXCLUDE && return 1
                        return 0
                    }

                    # Read the changed files directly instead of passing them through a
                    # step output: large diffs (thousands of paths) break $GITHUB_OUTPUT
                    # (xargs wraps long lists onto several lines) and the inlined
                    # expression. Deleted files are included so their last-modified
                    # entries can be removed.
                    if ! git diff --name-only -z "origin/$DEFAULT_BRANCH...HEAD" > "$RUNNER_TEMP/changed-files"; then
                        echo "Error: Failed to list changed files against origin/$DEFAULT_BRANCH" >&2
                        exit 1
                    fi

                    while IFS= read -r -d '' file; do
                    if ! is_tracked "$file"; then
                        continue
                    fi
                    
                    if [ ! -f "$file" ]; then
                        last_modified_file=".last-modified/$file"
                        if [ -f "$last_modified_file" ]; then
                            rm -- "$last_modified_file"
                            echo "Removed $last_modified_file"
                        fi
                        echo "Neither '$file' nor '$last_modified_file' exists, skipping."
                        continue
                    fi
                    
                    # Get last commit date in ISO format
                    if ! iso=$(git log -1 --format=%cd --date=format-local:'%Y-%m-%dT%H:%M:%S%z' "$file"); then
                        echo "Error: Failed to get git log for '$file'" >&2
                        exit 1
                    fi
                    if ! datetime=$(git log -1 --format=%cd --date=iso-strict-local "$file"); then
                        echo "Error: Failed to get git log for '$file'" >&2
                        exit 1
                    fi
                
                    # Create output directory structure
                    dir=$(dirname ".last-modified/$file")
                    if ! mkdir -p "$dir"; then
                        echo "Error: Failed to create directory '$dir'" >&2
                        exit 1
                    fi
                    
                    # Replace any forward slashes in path with underscores for xml:id
                    xml_id=${file//\//0x2F}
                    
                    # Convert date to seconds since epoch
                    if [[ "$OSTYPE" == "darwin"* ]]; then
                        if ! seconds_since_epoch=$(date -j -f "%Y-%m-%dT%H:%M:%S%z" "$iso" "+%s"); then
                            echo "Error: Failed to convert date for '$file'" >&2
                            exit 1
                        fi
                    else
                        if ! seconds_since_epoch=$(date -d "$iso" +%s); then
                            echo "Error: Failed to convert date for '$file'" >&2
                            exit 1
                        fi
                    fi
                    
                    # Write XML files
                    if ! echo "<?xml version=\"1.0\" encoding=\"UTF-8\"?>" > ".last-modified/$file"; then
                        echo "Error: Failed to write XML header for '$file'" >&2
                        exit 1
                    fi
                    
                    if ! echo "<last-modified xml:id=\"$xml_id\" seconds_since_epoch=\"$seconds_since_epoch\">$datetime</last-modified>" >> ".last-modified/$file"; then
                        echo "Error: Failed to write XML content for '$file'" >&2
                        exit 1
                    fi
                    echo "Successfully created .last-modified/$file"
                    done < "$RUNNER_TEMP/changed-files"

                    # Prune entries that are no longer covered by include/exclude
                    # (e.g. stubs for package.json created by earlier versions).
                    if [ -d .last-modified ]; then
                        while IFS= read -r -d '' entry; do
                            if ! is_tracked "${entry#.last-modified/}"; then
                                rm -- "$entry"
                                echo "Pruned $entry"
                            fi
                        done < <(find .last-modified -type f -print0)
                    fi
            - name: Commit and Push
              uses: actions-x/commit@v6
              with:
                email: actions@github.com
                name: GitHub Actions
                message: "fix: updated .last-modified [skip ci]"